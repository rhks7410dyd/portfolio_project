name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy whenever the daily data-refresh workflows commit new data, even
  # though those commits don't trigger `on: push` themselves (GITHUB_TOKEN
  # pushes don't chain workflows; workflow_run isn't subject to that limit).
  workflow_run:
    workflows: ['Update GitHub projects', 'Update GitHub activity']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      # GitHub Pages has no server-side rewrites, so a direct load of e.g.
      # /projects would 404. Serving a copy of index.html as 404.html lets
      # the client-side router take over from there.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
